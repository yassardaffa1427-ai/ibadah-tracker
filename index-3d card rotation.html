<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>3D Draggable Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter+Tight:wght@400;600&family=DM+Sans:opsz,wght@9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --card-w: 305px;
    --card-h: 467px;
    --radius: 36px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#ffffff;
    overflow:hidden;
    font-family:'Inter','Inter Tight',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    width:100%;
    height:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
    perspective: 1600px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    overflow:hidden;
  }

  .card{
    position:relative;
    width: var(--card-w);
    height: var(--card-h);
    max-width: 86vw;
    max-height: 78vh;
    aspect-ratio: 305 / 467;
    transform-style: preserve-3d;
    cursor: grab;
    will-change: transform;
    transform: rotateX(0deg) rotateY(0deg) scale(1);
  }
  .card.grabbing{ cursor: grabbing; }
  .card.snapping{
    transition: transform .75s cubic-bezier(.16,1,.3,1);
  }

  .face{
    position:absolute;
    inset:0;
    border-radius: var(--radius);
    overflow:hidden;
    background: transparent;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,.40), 0 8px 20px -8px rgba(0,0,0,.20);
  }

  .face .art{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform: scale(1.012);
    pointer-events:none;
    display:block;
  }

  .face-back{
    transform: rotateY(180deg);
  }

  /* ---------- front content ---------- */
  .front-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:14px;
    padding: 5.6% 6.7%;
    color:#fff;
  }

  .name-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .name-block p{ margin:0; }
  .name-title{
    font-family:'Inter Tight','Inter',sans-serif;
    font-weight:600;
    font-size: clamp(14px, 4.6vw, 18px);
  }
  .name-title .tag{ font-weight:400; }
  .name-sub{
    font-family:'DM Sans','Inter',sans-serif;
    font-size: clamp(11px, 3.4vw, 14px);
    opacity:.92;
    margin-top:4px !important;
  }
  .name-logo{ width:37px; height:37px; flex:0 0 auto; }
  .name-logo img{ width:100%; height:100%; display:block; }

  .badges{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.12);
    border-radius:30px;
    padding:3px 10px 3px 3px;
  }
  .badge.alt{ background:rgba(255,255,255,.22); }
  .badge img{ width:26px; height:26px; border-radius:50%; display:block; }
  .badge span{
    font-weight:600;
    font-size: clamp(11px, 3.2vw, 14px);
    white-space:nowrap;
  }

  .stats{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .stat .val{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: clamp(13px, 3.8vw, 16px);
    padding:6px 0;
  }
  .stat .val img{ width:11px; height:11px; }
  .stat .lbl{ font-size: clamp(9px, 2.7vw, 12px); opacity:.85; }
  .divider{ width:1px; height:29px; background:rgba(255,255,255,.4); }

  .cta-row{ display:flex; align-items:center; gap:9px; width:100%; }
  .bookmark-btn{
    flex:0 0 auto;
    width:62px;
    height:45px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    cursor:pointer;
  }
  .bookmark-btn img{ width:20px; height:20px; }
  .cta-btn{
    flex:1;
    height:45px;
    border-radius:50px;
    background:#fff;
    color:#000;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: clamp(12px, 3.6vw, 14px);
    cursor:pointer;
  }

  /* ---------- glare ---------- */
  .glare{
    position:absolute;
    inset:0;
    border-radius: var(--radius);
    pointer-events:none;
    background: radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,.30), rgba(255,255,255,0) 60%);
    opacity:0;
    mix-blend-mode: overlay;
  }

  .hint{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:#9a9a9a;
    letter-spacing:.02em;
    pointer-events:none;
    text-align:center;
  }

  @media (max-width:480px){
    .hint{ font-size:11px; bottom:16px; }
  }
</style>
</head>

  <div class="hint">Drag ke kiri / kanan untuk memutar kartu &middot; lepas untuk snap</div>

<script>
(function(){
  var card       = document.getElementById('card');
  var glareFront = document.getElementById('glareFront');
  var glareBack  = document.getElementById('glareBack');

  var ROT_PER_PX = 0.55;   // seberapa cepat kartu berputar saat di-drag
  var MAX_TILT_X = 20;     // batas miring atas-bawah
  var FRICTION   = 0.93;   // peredam momentum
  var MIN_VEL    = 0.25;   // ambang berhenti
  var MAX_VEL    = 26;     // batas lemparan agar tidak berputar liar

  var rotY = 0, rotX = 0, velY = 0;
  var dragging = false, pointerId = null;
  var lastX = 0, startY = 0, baseRotX = 0;
  var lastT = 0, rafId = null;

  function clamp(v, min, max){ return v < min ? min : (v > max ? max : v); }

  function render(){
    card.style.transform =
      'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg) scale(' +
      (dragging ? 1.03 : 1) + ')';

    // sisi mana yang sedang menghadap kamera
    var norm = ((rotY % 360) + 360) % 360;
    var backFacing = norm > 90 && norm < 270;

    // glare mengikuti sudut putar, hanya pada sisi yang terlihat
    var intensity = dragging ? 1 : 0;
    var gx = 50 + clamp(rotY % 180, -90, 90) * 0.4;
    var gy = 50 - rotX * 1.2;

    var active = backFacing ? glareBack : glareFront;
    var idle   = backFacing ? glareFront : glareBack;
    active.style.setProperty('--gx', gx + '%');
    active.style.setProperty('--gy', gy + '%');
    active.style.opacity = intensity;
    idle.style.opacity = 0;
  }

  function stopInertia(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  function onDown(e){
    stopInertia();
    card.classList.remove('snapping');
    card.classList.add('grabbing');
    dragging = true;
    velY = 0;

    // jaga nilai sudut tetap kecil (kelipatan 360 = orientasi sama, tidak ada lompatan)
    rotY = rotY % 360;

    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX;
    startY = p.clientY;
    baseRotX = rotX;
    lastT = performance.now();

    if(e.pointerId !== undefined && card.setPointerCapture){
      pointerId = e.pointerId;
      try { card.setPointerCapture(pointerId); } catch(err){}
    }
    render();
  }

  function onMove(e){
    if(!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    var now = performance.now();
    var dt = Math.max(now - lastT, 1);
    var dx = p.clientX - lastX;

    rotY += dx * ROT_PER_PX;

    // saat kartu menghadap belakang, arah miring vertikal dibalik agar terasa natural
    var norm = ((rotY % 360) + 360) % 360;
    var flipSign = (norm > 90 && norm < 270) ? -1 : 1;
    rotX = clamp(baseRotX + -(p.clientY - startY) * 0.12 * flipSign, -MAX_TILT_X, MAX_TILT_X);

    // kecepatan sudut (deg per frame @60fps) untuk momentum
    velY = clamp((dx * ROT_PER_PX) * (16.7 / dt), -MAX_VEL, MAX_VEL);

    lastX = p.clientX;
    lastT = now;
    render();
    if(e.cancelable) e.preventDefault();
  }

  function snap(){
    // berhenti di sisi depan (0) atau belakang (180) terdekat
    var target = Math.round(rotY / 180) * 180;
    card.classList.add('snapping');
    rotY = target;
    rotX = 0;
    render();
  }

  function inertia(){
    rotY += velY;
    velY *= FRICTION;
    rotX *= 0.90;
    render();

    if(Math.abs(velY) > MIN_VEL){
      rafId = requestAnimationFrame(inertia);
    } else {
      rafId = null;
      snap();
    }
  }

  function onUp(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('grabbing');

    if(pointerId !== null && card.releasePointerCapture){
      try { card.releasePointerCapture(pointerId); } catch(err){}
      pointerId = null;
    }

    if(Math.abs(velY) > MIN_VEL){
      stopInertia();
      rafId = requestAnimationFrame(inertia);
    } else {
      snap();
    }
  }

  if(window.PointerEvent){
    card.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive:false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  } else {
    card.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove, { passive:false });
    window.addEventListener('mouseup', onUp);
    card.addEventListener('touchstart', onDown, { passive:true });
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('touchend', onUp);
  }

  // double click / double tap tetap bisa membalik kartu
  card.addEventListener('dblclick', function(){
    stopInertia();
    card.classList.add('snapping');
    rotY = Math.round(rotY / 180) * 180 + 180;
    rotX = 0;
    render();
  });

  render();
})();
</script>
